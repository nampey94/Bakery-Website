services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    environment:
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3000/ | grep -q 'id=\"root\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  node_modules:
